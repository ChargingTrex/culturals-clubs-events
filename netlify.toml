# Netlify serves the React frontend; the Django API runs on Vercel
# (clubs-and-culturals-platform/app/backend/vercel.json), since Netlify
# Functions cannot run Python.
#
# Set in Netlify > Site configuration > Environment variables:
#   VITE_API_BASE = https://<backend>.vercel.app/api/v1
# and on the Vercel backend add this site's URL to CORS_ALLOWED_ORIGINS
# and CSRF_TRUSTED_ORIGINS.
[build]
  base = "clubs-and-culturals-platform/app/frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Client-side routes fall back to the app shell, as in frontend/vercel.json.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
