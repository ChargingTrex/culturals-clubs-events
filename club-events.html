<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club events — Culturals</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="layout">
  <nav class="nav" id="nav" aria-label="Your pages"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script type="module">
import { page, esc, inr, dateBox, fmtDate, statusPill, routeTracker, showError, toast,
  dialogForm } from "./src/ui.js";
import * as api from "./src/api.js";

const DECIDED = { return: "returned it", reject: "rejected it" };

await page("club-events.html", async (main, session, caps) => {
  if (!caps.clubs.length) {
    throw Object.assign(new Error("You hold no club role."),
      { status: 403, title: "No club", detail: "This page belongs to club members." });
  }
  const clubId = caps.clubs[0];
  const canOperate = caps.clubsCanOperateEvents.includes(clubId);
  const canPropose = caps.clubsCanPropose.includes(clubId);

  /** Why a proposal came back, in the approver's own words, where it is allowed. */
  const decisionNote = e => {
    const last = e.approval && e.approval.lastDecision;
    if (!last || !["returned", "rejected"].includes(e.status)) return "";
    return `<div class="note ${e.status === "rejected" ? "bad" : ""} decision-note">
      <strong>${esc(last.stageLabel)} ${DECIDED[last.decision] || last.decision}</strong>
      <span class="small muted">— ${esc(last.actorLabel)}, ${fmtDate(last.at)}</span>
      ${last.comment ? `<p style="margin:4px 0 0"><q>${esc(last.comment)}</q></p>`
        : `<p class="small muted" style="margin:4px 0 0">The comment goes to the
            office bearers who can see the budget.</p>`}
      ${e.status === "returned" && canPropose ? `<p class="small" style="margin:6px 0 0">
        Revise the budget, then send it again — it starts the route from the first
        gate.</p>` : ""}</div>`;
  };

  const draw = () => {
    const events = api.events.list(session, { club: clubId, ordering: "-startsAt" });
    main.innerHTML = `
      <div class="head"><div><h1>Club events</h1>
        <p class="muted">A proposal is created, priced by the Treasurer, then sent
          through the gates. Every event closes with photos and actual spend.</p>
      </div>${canPropose ? `<a class="btn primary" href="club-new-event.html">New
        event</a>` : ""}</div>
      <ul class="list">${events.map(e => `
        <li class="event club-event" data-event-title="${esc(e.title)}"
            data-status="${esc(e.status)}">${dateBox(e.startsAt)}
          <div><div class="row"><h3>${esc(e.title)}</h3>${statusPill(e.status)}</div>
            <p class="small muted">${esc(e.venueName)} · ${e.attended} attended ·
              ${e.registered} registered · ${e.photoCount} photos
              ${e.budget ? ` · ${inr(e.budget.totalRequested)} requested
                (${esc(e.budget.stageLabel)})` : ""}</p>
            ${e.approval && ["submitted", "returned", "rejected", "published"]
              .includes(e.status) ? routeTracker(e.approval) : ""}
            ${e.status === "submitted" && e.approval ? `<p class="small muted">With
              ${esc(e.approval.currentWith)} now.</p>` : ""}
            ${decisionNote(e)}
            ${e.budget && !e.budget.isReadyToSubmit ? `<p class="small"
              style="color:var(--bad);margin-top:4px">Unpriced — add entries on the
              Budget page, or declare it needs none.</p>` : ""}</div>
          <div class="row end">
            ${["draft", "returned"].includes(e.status) && caps.clubsWithBudgetAccess.length
              ? `<a class="btn" href="club-budget.html">Budget</a>` : ""}
            ${["draft", "returned"].includes(e.status) && e.budget?.isReadyToSubmit
              ? `<button class="btn primary" data-submit="${e.id}">Send for
                  approval</button>` : ""}
            ${canOperate && e.status === "published"
              ? `<button class="btn" data-live="${e.id}">Go live</button>` : ""}
            ${["live", "published"].includes(e.status) && caps.clubsDoorStaff.includes(clubId)
              ? `<a class="btn ${e.status === "live" ? "primary" : ""}"
                  href="organiser-scan.html?event=${e.id}">Scan station</a>` : ""}
            ${canOperate && ["live", "published"].includes(e.status)
              ? `<button class="btn" data-close="${e.id}">Close event</button>` : ""}
          </div></li>`).join("") || `<li class="empty">No events yet.
            ${canPropose ? `<a href="club-new-event.html">Propose one</a>.` : ""}</li>`}</ul>
      ${canOperate ? "" : `<p class="note" style="margin-top:16px">${canPropose
        ? "You can raise proposals and build budgets, but marking an event live and "
          + "closing it sit with the President, Vice-President and Secretary."
        : "You can follow the club's events; raising proposals and running them sit "
          + "with the office bearers."} The same rule is checked when you try.</p>`}`;
  };
  draw();

  const report = err => {
    const box = document.createElement("div");
    main.prepend(box);
    showError(box, err);
  };

  main.addEventListener("click", async event => {
    const button = event.target.closest("[data-submit],[data-live],[data-close]");
    if (!button) return;
    try {
      if (button.dataset.submit) {
        const approval = api.events.submit(session, button.dataset.submit);
        const first = api.events.get(session, approval.eventId).approval;
        toast(`Sent — now with ${first ? first.currentWith : "the first gate"}`);
      } else if (button.dataset.live) {
        api.events.goLive(session, button.dataset.live);
        toast("Live — the scan station is open");
      } else {
        const id = button.dataset.close;
        const title = api.events.get(session, id).title;
        const values = await dialogForm({
          title: `Close “${title}”`, testId: "close-event",
          intro: "Closing reports the event. It needs at least one photo — a closed "
            + "event with no evidence is the gap that makes a semester report thinner "
            + "than the semester was.",
          fields: [
            { name: "photos", label: "How many photos were uploaded?", type: "number",
              value: "6", min: 0, required: true },
            { name: "link", label: "Link to the post (optional)", type: "url",
              placeholder: "https://www.instagram.com/p/…" },
          ],
          submitLabel: "Close event",
          validate: v => (Number(v.photos) >= 1 ? null
            : "Upload at least one photo first — an event cannot close without evidence."),
        });
        if (!values) return;
        api.events.close(session, id, {
          photoCount: Number(values.photos) || 0,
          socialLinks: [values.link.trim()].filter(Boolean),
        });
        toast(caps.clubsCanEnterSpend.includes(clubId)
          ? "Closed and reported — record the spend on the Budget page to settle"
          : "Closed and reported");
      }
      draw();
    } catch (err) {
      report(err);
    }
  });
});
</script>
</body>
</html>
