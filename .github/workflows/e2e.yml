# Regression pack: the frontend's unit tests, the backend's unit tests on SQLite, and the Robot Framework
# suites (app/e2e) against a real backend and the built React app. Every push runs the smoke tag; pull
# requests and the main branches run everything. The Postgres backend job stays in backend-ci.yml.
name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: smoke or full
        default: full

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: clubs-and-culturals-platform/app

jobs:
  frontend:
    name: Frontend (typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clubs-and-culturals-platform/app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clubs-and-culturals-platform/app/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  django:
    name: Django tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clubs-and-culturals-platform/app/backend
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DJANGO_DEBUG: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clubs-and-culturals-platform/app/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test tests --settings=config.settings_test --noinput

  robot:
    name: Robot (${{ (github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'prototype' || github.event.inputs.mode == 'full') && 'full' || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODE: ${{ (github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'prototype' || github.event.inputs.mode == 'full') && 'full' || 'smoke' }}
      E2E_VENV: ${{ github.workspace }}/.e2e-venv
      E2E_WORK: ${{ github.workspace }}/.e2e-work
      E2E_FRONTEND: preview
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            clubs-and-culturals-platform/app/backend/requirements.txt
            clubs-and-culturals-platform/app/e2e/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clubs-and-culturals-platform/app/frontend/package-lock.json

      - name: Python requirements (backend + Robot)
        run: |
          python -m venv "$E2E_VENV"
          "$E2E_VENV/bin/pip" install -q -r "$APP/backend/requirements.txt" -r "$APP/e2e/requirements.txt"

      - name: Playwright Chromium for the Browser library
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('clubs-and-culturals-platform/app/e2e/requirements.txt') }}
      - run: |
          "$E2E_VENV/bin/rfbrowser" init chromium
          touch "$E2E_VENV/.rfbrowser-chromium-$("$E2E_VENV/bin/python" -c 'import Browser; print(Browser.__version__)')"

      - name: npm ci
        working-directory: clubs-and-culturals-platform/app/frontend
        run: npm ci

      - name: Seed, start both servers, run the suites
        working-directory: clubs-and-culturals-platform/app/e2e
        run: ./ci.sh "$MODE"

      - name: Robot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-${{ env.MODE }}
          path: |
            clubs-and-culturals-platform/app/e2e/results/**
            .e2e-work/*.log
          if-no-files-found: warn

      - name: No test failed
        if: always()
        working-directory: clubs-and-culturals-platform/app/e2e
        run: |
          "$E2E_VENV/bin/python" - <<'PY'
          from robot.api import ExecutionResult
          r = ExecutionResult("results/output.xml").statistics.total
          print(f"passed {r.passed}  failed {r.failed}  skipped {r.skipped}")
          raise SystemExit(1 if r.failed else 0)
          PY
