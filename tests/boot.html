<!doctype html>
<meta charset="utf-8">
<title>Test bootstrap</title>
<!--
  A fixture for tests/browser.sh. Signs in as a persona, seeds the dataset, then
  redirects to the page under test. Inner pages bounce to the login screen when
  nobody is signed in, so a headless browser needs this to reach them.
-->
<script type="module">
const q = new URLSearchParams(location.search);
localStorage.setItem("culturals.persona", q.get("as"));
const { ensureSeeded } = await import("../src/bootstrap.js");
await ensureSeeded();
location.replace(`../${q.get("to")}`);
</script>
