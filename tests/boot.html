<!doctype html>
<meta charset="utf-8">
<title>Test bootstrap</title>
<!--
  A fixture for tests/browser.sh. Signs in with the demo credentials for a persona,
  seeds the dataset, then redirects to the page under test.

  It goes through signIn() rather than writing a session into storage, so the
  headless check exercises the real sign-in path and would fail if credentials
  broke.
-->
<script type="module">
const q = new URLSearchParams(location.search);
const { ensureSeeded } = await import("../src/bootstrap.js");
await ensureSeeded();
const { DEMO_ACCOUNTS, DEMO_MFA_CODE, signIn } = await import("../src/credentials.js");
const account = DEMO_ACCOUNTS.find(a => a.persona === q.get("as"));
if (!account) {
  document.title = `no such persona: ${q.get("as")}`;
} else {
  await signIn({
    email: account.email, password: account.password, mfaCode: DEMO_MFA_CODE,
  });
  location.replace(`../${q.get("to")}`);
}
</script>
