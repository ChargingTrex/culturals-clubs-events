<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Members & roles — Culturals</title><link rel="stylesheet" href="shared.css"></head>
<body><div class="layout">
<nav class="nav" id="nav" aria-label="Your pages"></nav>
<main id="main" tabindex="-1"></main></div>
<script type="module">
import { page, api, me, esc } from "./demo.js";
await page("club-roster.html", async main => {
  const caps = (await me()).capabilities;
  if (!caps.clubs.length) throw Object.assign(new Error("You hold no club role."), { status: 403, title: "No club" });
  const clubId = caps.clubs[0];
  const d = await api(`/clubs/${clubId}/members`);
  const order = ["club_president","club_vice_president","club_treasurer","club_secretary","club_core","club_member"];
  main.innerHTML = `
    <div class="head"><div><h1>${esc(d.club.name)} members</h1>
      <p class="muted">${d.results.length} members. ${d.can_assign_roles
        ? "You can assign roles." : "Only the President or Vice-President can assign roles."}</p></div></div>
    ${d.can_assign_roles ? "" : `<p class="note" style="margin-bottom:14px">Role controls are off
      for this role. The same rule is checked when a change is saved — hiding the control
      is not the permission.</p>`}
    <div class="table-wrap"><table><thead><tr><th>Name</th><th>PRN</th><th>Programme</th>
      <th>Role</th></tr></thead><tbody>
      ${d.results.map(m => `<tr><td>${esc(m.full_name)}</td><td class="muted">${esc(m.prn)}</td>
        <td class="muted">${esc(m.programme)}, Y${m.year ?? "—"}</td>
        <td>${d.can_assign_roles
          ? `<select data-role="${m.id}">${order.map(r =>
              `<option value="${r}" ${r === m.role ? "selected" : ""}>${r.replace("club_","").replace("_"," ")}</option>`).join("")}</select>`
          : `<span class="pill">${esc(m.role_label)}</span>`}</td></tr>`).join("")}
    </tbody></table></div>
    ${d.recent_changes.length ? `<div class="panel" style="margin-top:18px"><h3>Role changes</h3>
      <ul class="list" style="margin-top:8px">${d.recent_changes.map(c =>
        `<li class="small">${esc(c.actor_label)} changed ${esc(c.from_role.replace("club_",""))} →
          ${esc(c.to_role.replace("club_",""))}${c.reason ? " — " + esc(c.reason) : ""}</li>`).join("")}</ul></div>` : ""}`;
  main.addEventListener("change", async ev => {
    const sel = ev.target.closest("[data-role]"); if (!sel) return;
    const { showError } = await import("./demo.js");
    try {
      await api(`/memberships/${sel.dataset.role}/role`,
        { method: "POST", body: JSON.stringify({ role: sel.value, reason: "Demo change" }) });
      location.reload();
    } catch (err) { const b = document.createElement("div"); main.prepend(b); showError(b, err); }
  });
});
</script></body></html>
