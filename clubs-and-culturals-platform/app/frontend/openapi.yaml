  /api/v1/module/directory/students:
    get:
      operationId: module_directory_students_retrieve
      description: |-
        PRN or name lookup for the check-in desk.

        Scoped deliberately: an organiser may see attendee identities for their own
        event only (AGENT_PROMPT §6), so this requires either an approval role or an
        organiser scope, and returns the minimum a desk needs to identify someone.
      summary: Find a student by PRN or name (desk lookup)
      tags:
      - module
      responses:
        '200':
          description: No response body
  /api/v1/module/semesters:
    get:
      operationId: module_semesters_retrieve
      summary: Academic calendar (platform-owned; read only)
      tags:
      - module
      responses:
        '200':
          description: No response body
  /api/v1/participation/events/{event_id}/check-in:
    post:
      operationId: participation_events_check_in_create
      summary: Check in by PRN lookup
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - participation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualCheckIn'
