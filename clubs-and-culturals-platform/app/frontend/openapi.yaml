openapi: 3.0.3
info:
  title: Clubs & Events API
  version: 1.0.0
  description: Clubs, events, participation, budget and approvals for the Student
    Management Portal.
paths:
  /api/v1/budget/budget-templates:
    get:
      operationId: budget_budget_templates_retrieve
      description: |-
        Templates, with the amounts a club would get for a given headcount.

        The preview is computed server-side so the figure a club sees while proposing
        is the figure that will be created — the prototype computed it in the browser,
        which meant two implementations of the same arithmetic.
      summary: Budget templates, priced for an expected attendance
      parameters:
      - in: query
        name: expected_attendance
        schema:
          type: integer
        description: Headcount to price per-head lines at (default 80).
      tags:
      - budget
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetTemplates'
          description: ''
  /api/v1/budget/budgets:
    get:
      operationId: budget_budgets_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - budget
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBudgetList'
          description: ''
  /api/v1/budget/budgets/{id}:
    get:
      operationId: budget_budgets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this budget.
        required: true
      tags:
      - budget
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/declare-nil:
    post:
      operationId: budget_budgets_declare_nil_create
      summary: Declare that the event needs no budget
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this budget.
        required: true
      tags:
      - budget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Nil'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Nil'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Nil'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/lines:
    post:
      operationId: budget_budgets_lines_create
      summary: Add a budget line
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this budget.
        required: true
      tags:
      - budget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Line'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Line'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Line'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/lines/{line_id}:
    patch:
      operationId: budget_budgets_lines_partial_update
      summary: Record spend on one budget line
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this budget.
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - budget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSpend'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSpend'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSpend'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/lines/{line_id}/edit:
    put:
      operationId: budget_budgets_lines_edit_update
      summary: Edit a budget line's head or amount
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this budget.
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - budget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineEdit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LineEdit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LineEdit'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/lines/{line_id}/receipts:
    post:
      operationId: budget_budgets_lines_receipts_create
      summary: Attach a receipt to one budget line
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this budget.
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - budget
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReceiptUpload'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
          description: ''
  /api/v1/budget/budgets/{id}/lines/{line_id}/receipts/{receipt_id}/file:
    get:
      operationId: budget_budgets_lines_receipts_file_retrieve
      description: |-
        PRD §5.19.4: the people reviewing a settlement can open the attachment.

        Who: the queryset already limits budgets to BUDGET_VIEWERS of the club and
        to staff (Dean, Cultural Society, Vice-Chancellor, admin), so a plain
        member is 404 here as everywhere else on the budget. The VC may see a
        receipt: it is a vendor's bill and carries no student data. A superseded
        receipt is still served — the old row is evidence of what was first
        claimed, which is the whole reason it was kept.
      summary: The stored receipt file, with its original content type
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this budget.
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: receipt_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - budget
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: ''
        '302':
          description: No response body
  /api/v1/budget/budgets/{id}/lines/{line_id}/remove:
    delete:
      operationId: budget_budgets_lines_remove_destroy
      summary: Remove a budget line before submission
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this budget.
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - budget
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/settle:
    post:
      operationId: budget_budgets_settle_create
      summary: Settle the budget once spend and evidence are complete
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this budget.
        required: true
      tags:
      - budget
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/withdraw-nil:
    post:
      operationId: budget_budgets_withdraw_nil_create
      summary: Withdraw a nil declaration so the budget can be priced
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this budget.
        required: true
      tags:
      - budget
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/envelopes/{club_id}:
    get:
      operationId: budget_envelopes_retrieve
      description: |-
        A club's annual envelope with running utilisation (PRD §5.7.3, §5.19.5).

        GET: BUDGET_VIEWERS of that club, Dean, Cultural Society, Vice-Chancellor,
        admin. Everyone else — including the club's own plain members, who have no
        budget visibility (AGENT_PROMPT §6) — gets 404, the same as for the budgets
        the figure is made of.

        PUT: Dean or admin. PRD §5.13 names the Student Life Office as the body that
        configures approval behaviour, but no such role exists in common/roles.py
        yet, so the Dean sets the envelope until it does.
      summary: Annual envelope and utilisation for one club
      parameters:
      - in: path
        name: club_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - budget
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeOut'
          description: ''
    put:
      operationId: budget_envelopes_update
      description: |-
        A club's annual envelope with running utilisation (PRD §5.7.3, §5.19.5).

        GET: BUDGET_VIEWERS of that club, Dean, Cultural Society, Vice-Chancellor,
        admin. Everyone else — including the club's own plain members, who have no
        budget visibility (AGENT_PROMPT §6) — gets 404, the same as for the budgets
        the figure is made of.

        PUT: Dean or admin. PRD §5.13 names the Student Life Office as the body that
        configures approval behaviour, but no such role exists in common/roles.py
        yet, so the Dean sets the envelope until it does.
      summary: Set the envelope for a year
      parameters:
      - in: path
        name: club_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - budget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeSet'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnvelopeSet'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvelopeSet'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeOut'
          description: ''
  /api/v1/clubs:
    get:
      operationId: clubs_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - clubs
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClubList'
          description: ''
    post:
      operationId: clubs_create
      tags:
      - clubs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Club'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Club'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Club'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
          description: ''
  /api/v1/clubs/{id}:
    get:
      operationId: clubs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      tags:
      - clubs
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
          description: ''
    put:
      operationId: clubs_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      tags:
      - clubs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Club'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Club'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Club'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
          description: ''
    patch:
      operationId: clubs_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      tags:
      - clubs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClub'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClub'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClub'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
          description: ''
    delete:
      operationId: clubs_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      tags:
      - clubs
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/clubs/{id}/handover:
    post:
      operationId: clubs_handover_create
      summary: Hand the club's offices over (President or Vice-President only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      tags:
      - clubs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoverRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HandoverRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HandoverRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverOut'
          description: ''
  /api/v1/clubs/{id}/join:
    post:
      operationId: clubs_join_create
      summary: 'Ask to join a club: immediate for open clubs, queued otherwise'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      tags:
      - clubs
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequest'
          description: ''
  /api/v1/clubs/{id}/join-requests:
    get:
      operationId: clubs_join_requests_retrieve
      summary: Pending join requests (President or Vice-President only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      - in: query
        name: state
        schema:
          type: string
          enum:
          - accepted
          - all
          - declined
          - pending
        description: Default `pending`; `all` for every state.
      tags:
      - clubs
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequests'
          description: ''
  /api/v1/clubs/{id}/join-requests/{request_id}/accept:
    post:
      operationId: clubs_join_requests_accept_create
      summary: Accept a join request
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clubs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinDecision'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JoinDecision'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JoinDecision'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequest'
          description: ''
  /api/v1/clubs/{id}/join-requests/{request_id}/decline:
    post:
      operationId: clubs_join_requests_decline_create
      summary: Decline a join request
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clubs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinDecision'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JoinDecision'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JoinDecision'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequest'
          description: ''
  /api/v1/clubs/{id}/members:
    get:
      operationId: clubs_members_retrieve
      summary: Members of a club, with their roles
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      tags:
      - clubs
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubMembers'
          description: ''
  /api/v1/clubs/{id}/office-bearers/history:
    get:
      operationId: clubs_office_bearers_history_retrieve
      summary: Who held which office, when
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      tags:
      - clubs
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeBearerHistory'
          description: ''
  /api/v1/events:
    get:
      operationId: events_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - cultural
          - literary
          - social
          - sports
          - technical
        description: Events of clubs in this category. An unknown value matches nothing.
      - in: query
        name: club
        schema:
          type: string
          format: uuid
      - in: query
        name: ordering
        schema:
          type: string
        description: Model field to order by (default `starts_at`).
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: starts_at_after
        schema:
          type: string
          format: date-time
      - in: query
        name: starts_at_before
        schema:
          type: string
          format: date-time
      - in: query
        name: status
        schema:
          type: string
        description: Comma-separated event statuses.
      tags:
      - events
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
    post:
      operationId: events_create
      summary: Propose an event and send it for approval
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventCreate'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCreated'
          description: ''
  /api/v1/events/{id}:
    get:
      operationId: events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this event.
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    put:
      operationId: events_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this event.
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Event'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Event'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    patch:
      operationId: events_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this event.
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEvent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEvent'
