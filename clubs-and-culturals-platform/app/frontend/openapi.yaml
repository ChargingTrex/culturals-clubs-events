      description: |-
        Running totals and what needs chasing (PRD §6.3). Dean, admin and the
        Cultural Society; the VC gets the semester report, not the chase list.
        `capture` is documented by reporting.serializers.CaptureMetricsSerializer.
      summary: Running totals and what needs chasing
      parameters:
      - in: query
        name: semester
        schema:
          type: string
          format: uuid
        description: Semester id; defaults to the current semester.
      tags:
      - reporting
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeanOverview'
          description: ''
  /api/v1/reporting/reports/semester:
    get:
      operationId: reporting_reports_semester_retrieve
      description: |-
        The semester report.

        Available to the Dean and the Vice-Chancellor. The VC sees aggregates only —
        AGENT_PROMPT §6 is explicit that the Vice-Chancellor gets no individual
        records, and this endpoint returns none.

        `?format=csv` (or the `/csv` path) returns the same figures as `text/csv`
        (B-10b). One permission check serves both: the renderer is chosen before the
        handler runs, and the handler decides who may read regardless of format.
      summary: Semester report — aggregates only, no individual records
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
        description: csv returns text/csv with the same totals.
      - in: query
        name: semester
        schema:
          type: string
          format: uuid
        description: Semester id; defaults to the current semester.
      tags:
      - reporting
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemesterReport'
            text/csv:
              schema:
                type: string
          description: ''
  /api/v1/reporting/reports/semester/csv:
    get:
      operationId: reporting_reports_semester_csv_retrieve
      description: |-
        The semester report.

        Available to the Dean and the Vice-Chancellor. The VC sees aggregates only —
        AGENT_PROMPT §6 is explicit that the Vice-Chancellor gets no individual
        records, and this endpoint returns none.

        `?format=csv` (or the `/csv` path) returns the same figures as `text/csv`
        (B-10b). One permission check serves both: the renderer is chosen before the
        handler runs, and the handler decides who may read regardless of format.
      summary: Semester report — aggregates only, no individual records
      parameters:
      - in: query
        name: format
