components:
  schemas:
    ApprovalClash:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        club:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        expected_attendance:
          type: integer
      required:
      - club
      - ends_at
      - expected_attendance
      - id
      - starts_at
      - title
    ApprovalLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        head:
          type: string
        amount_requested:
          type: string
        amount_sanctioned:
          type: string
          nullable: true
      required:
      - amount_requested
      - amount_sanctioned
      - head
      - id
    ApprovalQueue:
      type: object
      description: Response shape of ApprovalViewSet.queue.
      properties:
        stages_you_hold:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalStageEnum'
        stages_delegated_to_you:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalStageEnum'
        sla_hours:
          type: integer
        escalated_only:
          type: boolean
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRequest'
      required:
      - count
      - escalated_only
      - results
      - sla_hours
      - stages_delegated_to_you
      - stages_you_hold
    ApprovalRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event:
          type: string
          format: uuid
        event_title:
          type: string
          readOnly: true
        club:
          type: string
          readOnly: true
        club_id:
          type: string
          format: uuid
          readOnly: true
        venue:
          type: string
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        expected_attendance:
          type: integer
          readOnly: true
        stages: {}
        current_stage:
          $ref: '#/components/schemas/ApprovalStageEnum'
        stage_label:
          type: string
          readOnly: true
        state:
          $ref: '#/components/schemas/ApprovalStateEnum'
        amount_requested:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        requires_vc:
          type: boolean
        vc_reason:
          type: string
          maxLength: 120
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalStep'
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalLine'
          readOnly: true
        clashes:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalClash'
          readOnly: true
        my_stage:
          type: boolean
          readOnly: true
        requires_mfa:
          type: boolean
          readOnly: true
        nil_declaration:
          allOf:
          - $ref: '#/components/schemas/NilDeclaration'
          nullable: true
          readOnly: true
        stage_entered_at:
          type: string
          format: date-time
        age_hours:
          type: number
          format: double
          readOnly: true
        escalated:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - age_hours
      - clashes
      - club
      - club_id
      - created_at
      - current_stage
      - ends_at
      - escalated
      - event
      - event_title
      - expected_attendance
      - id
      - lines
      - my_stage
      - nil_declaration
      - requires_mfa
      - stage_label
      - starts_at
      - steps
      - venue
    ApprovalStageEnum:
      enum:
      - cultural_society
      - dean
      - vc
      type: string
      description: |-
        * `cultural_society` - Cultural Society
        * `dean` - Dean of Student Affairs
        * `vc` - Vice-Chancellor
    ApprovalStateEnum:
      enum:
      - pending
      - approved
      - returned
      - rejected
      - withdrawn
      type: string
      description: |-
        * `pending` - Awaiting a decision
        * `approved` - Approved
        * `returned` - Returned for changes
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn by the club
    ApprovalStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        stage:
          $ref: '#/components/schemas/ApprovalStageEnum'
        stage_label:
          type: string
          readOnly: true
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        comment:
          type: string
        actor_label:
          type: string
          maxLength: 80
        actor_role:
          type: string
          maxLength: 40
        mfa_verified:
          type: boolean
        amount_sanctioned:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        on_behalf_of:
          type: string
          format: uuid
          nullable: true
        on_behalf_of_label:
          type: string
          maxLength: 80
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_label
      - actor_role
      - created_at
      - decision
      - id
      - stage
      - stage_label
    ApprovalSummary:
      type: object
      description: The approval request opened by a submission, as the proposer sees
