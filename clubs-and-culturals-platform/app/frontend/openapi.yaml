openapi: 3.0.3
info:
  title: Clubs & Events API
  version: 1.0.0
  description: Clubs, events, participation, budget and approvals for the Student
    Management Portal.
paths:
  /api/v1/budget/budget-templates:
    get:
      operationId: budget_budget_templates_retrieve
      description: |-
        Templates, with the amounts a club would get for a given headcount.

        The preview is computed server-side so the figure a club sees while proposing
        is the figure that will be created — the prototype computed it in the browser,
        which meant two implementations of the same arithmetic.
      summary: Budget templates, priced for an expected attendance
      tags:
      - budget
      responses:
        '200':
          description: No response body
  /api/v1/budget/budgets:
    get:
      operationId: budget_budgets_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - budget
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBudgetList'
          description: ''
  /api/v1/budget/budgets/{id}:
    get:
      operationId: budget_budgets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - budget
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/declare-nil:
    post:
      operationId: budget_budgets_declare_nil_create
      summary: Declare that the event needs no budget
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - budget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Nil'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Nil'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Nil'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/lines:
    post:
      operationId: budget_budgets_lines_create
      summary: Add a budget line
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - budget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Line'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Line'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Line'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/lines/{line_id}:
    patch:
      operationId: budget_budgets_lines_partial_update
      summary: Record spend on one budget line
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          pattern: ^[0-9a-f-]+$
        required: true
      tags:
      - budget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSpend'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSpend'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSpend'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/lines/{line_id}/edit:
    put:
      operationId: budget_budgets_lines_edit_update
      summary: Edit a budget line's head or amount
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          pattern: ^[0-9a-f-]+$
        required: true
      tags:
      - budget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineEdit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LineEdit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LineEdit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/lines/{line_id}/receipts:
    post:
      operationId: budget_budgets_lines_receipts_create
      summary: Attach a receipt to one budget line
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          pattern: ^[0-9a-f-]+$
        required: true
      tags:
      - budget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Budget'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Budget'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Budget'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/lines/{line_id}/remove:
    delete:
      operationId: budget_budgets_lines_remove_destroy
      summary: Remove a budget line before submission
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          pattern: ^[0-9a-f-]+$
        required: true
      tags:
      - budget
      responses:
        '204':
          description: No response body
  /api/v1/budget/budgets/{id}/settle:
    post:
      operationId: budget_budgets_settle_create
      summary: Settle the budget once spend and evidence are complete
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - budget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Budget'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Budget'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Budget'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/budget/budgets/{id}/withdraw-nil:
    post:
      operationId: budget_budgets_withdraw_nil_create
      summary: Withdraw a nil declaration so the budget can be priced
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - budget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Budget'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Budget'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Budget'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/clubs:
    get:
      operationId: clubs_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - clubs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClubList'
          description: ''
    post:
      operationId: clubs_create
      tags:
      - clubs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Club'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Club'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Club'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
          description: ''
  /api/v1/clubs/{id}:
    get:
      operationId: clubs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      tags:
      - clubs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
          description: ''
    put:
      operationId: clubs_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      tags:
      - clubs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Club'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Club'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Club'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
          description: ''
    patch:
      operationId: clubs_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      tags:
      - clubs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClub'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClub'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClub'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
          description: ''
    delete:
      operationId: clubs_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      tags:
      - clubs
      responses:
        '204':
          description: No response body
  /api/v1/clubs/{id}/members:
    get:
      operationId: clubs_members_retrieve
      summary: Members of a club, with their roles
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this club.
        required: true
      tags:
      - clubs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
          description: ''
  /api/v1/events:
    get:
      operationId: events_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - events
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
    post:
      operationId: events_create
      summary: Propose an event and send it for approval
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/v1/events/{id}:
    get:
      operationId: events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    put:
      operationId: events_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Event'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Event'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    patch:
      operationId: events_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEvent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEvent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEvent'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    delete:
      operationId: events_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      responses:
        '204':
          description: No response body
  /api/v1/events/{id}/clashes:
    get:
      operationId: events_clashes_retrieve
      summary: Clashes and free alternatives for this event
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/v1/events/{id}/close:
    post:
      operationId: events_close_create
      summary: Close an event with its evidence
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseEvent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CloseEvent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CloseEvent'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/v1/events/{id}/go-live:
    post:
      operationId: events_go_live_create
      summary: Mark an event live so the scan station can open
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Event'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Event'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/v1/events/{id}/reassign:
    post:
      operationId: events_reassign_create
      summary: Move an event to another venue (Dean only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReassignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReassignRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/v1/events/{id}/submit:
    post:
      operationId: events_submit_create
      summary: Submit or resubmit a proposal for approval
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Event'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Event'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/v1/governance/approvals:
    get:
      operationId: governance_approvals_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - governance
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalRequestList'
          description: ''
  /api/v1/governance/approvals/{id}:
    get:
      operationId: governance_approvals_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - governance
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
          description: ''
  /api/v1/governance/approvals/{id}/decide:
    post:
      operationId: governance_approvals_decide_create
      summary: Approve, return or reject
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decide'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Decide'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Decide'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
          description: ''
  /api/v1/governance/approvals/queue:
    get:
      operationId: governance_approvals_queue_retrieve
      summary: Your approval queue — only the stages you hold
      tags:
      - governance
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
          description: ''
  /api/v1/governance/audit:
    get:
      operationId: governance_audit_retrieve
      description: |-
        Read-only audit trail. Append-only by construction: nothing in the API writes
        to it except the adapter, and nothing anywhere updates or deletes an entry.
      tags:
      - governance
      responses:
        '200':
          description: No response body
  /api/v1/governance/notifications:
    get:
      operationId: governance_notifications_list
      description: |-
        In-app notifications for the caller only. Email copies go out through the same
        adapter call; no third channel exists.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - governance
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/governance/notifications/mark-read:
    post:
      operationId: governance_notifications_mark_read_create
      description: |-
        In-app notifications for the caller only. Email copies go out through the same
        adapter call; no third channel exists.
      summary: Mark all as read
      tags:
      - governance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Notification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Notification'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/governance/notifications/unread-count:
    get:
      operationId: governance_notifications_unread_count_retrieve
      description: |-
        In-app notifications for the caller only. Email copies go out through the same
        adapter call; no third channel exists.
      summary: Unread count for the bell
      tags:
      - governance
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/memberships/{id}/role:
    post:
      operationId: memberships_role_create
      description: |-
        AGENT_PROMPT §6: only President and Vice-President may assign roles, and
        the Treasurer explicitly may not. The check happens here, on save — the
        frontend also hides the control, but hiding a control is not a permission.
      summary: Assign a club role (President or Vice-President only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - memberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleChangeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/module/auth/demo/{persona}:
    post:
      operationId: module_auth_demo_create
      description: |-
        Issue a real token for a demo persona, with no password.

        The token is ordinary: same claims, same expiry, same signature. Every
        permission check downstream runs untouched, which is why the demo can show a
        403 on the Vice-Chancellor's roster attempt and mean it.
      summary: Passwordless login for a demo persona (DEMO_MODE only)
      parameters:
      - in: path
        name: persona
        schema:
          type: string
        required: true
      tags:
      - module
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/module/auth/demo/personas:
    get:
      operationId: module_auth_demo_personas_retrieve
      description: The personas a demo can switch between. 404 when DEMO_MODE is off.
      summary: Demo personas (DEMO_MODE only)
      tags:
      - module
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/module/auth/login:
    post:
      operationId: module_auth_login_create
      description: Standalone mode only (§5.2). Refused outright in platform mode.
      summary: Password login (standalone mode)
      tags:
      - module
      requestBody:
        content:
          application/json:
            schema:
