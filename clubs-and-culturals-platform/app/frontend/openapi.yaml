  /api/v1/jobs/{name}:
    get:
      operationId: jobs_retrieve
      description: |-
        `POST /api/v1/jobs/{name}` with `Authorization: Bearer <JOBS_TOKEN>`.

        401 JOBS_UNAUTHORIZED when the header is missing or wrong (logged), 503
        JOBS_DISABLED when the host has no token or one shorter than 32 characters, 404 JOBS_UNKNOWN for a name not in
        `jobs.services.JOBS`, 501 JOBS_NOT_WIRED when the job's dependency is not in
        this build. Success returns `{job, started_at, finished_at, result}` and
        writes an AuditEntry.
      summary: Trigger a scheduled job — GET form, because Vercel Cron only issues
        GET
      parameters:
      - in: path
        name: name
        schema:
          type: string
          enum:
          - apply-due-terms
          - escalate-sla
          - flag-dormant
          - purge-external
          - rollup-scans
        description: Job name
        required: true
      tags:
      - jobs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRun'
          description: ''
    post:
      operationId: jobs_create
      description: |-
        `POST /api/v1/jobs/{name}` with `Authorization: Bearer <JOBS_TOKEN>`.

        401 JOBS_UNAUTHORIZED when the header is missing or wrong (logged), 503
        JOBS_DISABLED when the host has no token or one shorter than 32 characters, 404 JOBS_UNKNOWN for a name not in
        `jobs.services.JOBS`, 501 JOBS_NOT_WIRED when the job's dependency is not in
        this build. Success returns `{job, started_at, finished_at, result}` and
        writes an AuditEntry.
      summary: Trigger a scheduled job (Vercel Cron; shared secret, not a user token)
      parameters:
      - in: path
        name: name
        schema:
          type: string
          enum:
          - apply-due-terms
          - escalate-sla
          - flag-dormant
          - purge-external
          - rollup-scans
        description: Job name
        required: true
      tags:
      - jobs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRun'
          description: ''
