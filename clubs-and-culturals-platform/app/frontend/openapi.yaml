            schema:
              $ref: '#/components/schemas/ManualCheckIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManualCheckIn'
      responses:
        '200':
          description: No response body
  /api/v1/participation/events/{event_id}/roster:
    get:
      operationId: participation_events_roster_retrieve
      description: |-
        The attendee list for one event.

        Scoped to the people who need it: this event's organisers, the club's door
        staff, and the staff cleared for individual records. The Vice-Chancellor is
        excluded — this list is names and PRNs, and Management receives aggregates.

        Everyone else gets 404 rather than 403: the existence of an attendee list is
        itself disclosure (API_Standards §3.3).
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - participation
      responses:
        '200':
          description: No response body
  /api/v1/participation/events/{event_id}/scan:
    get:
      operationId: participation_events_scan_retrieve
      description: |-
        The door.

        The organiser scans the student, never the reverse (AGENT_PROMPT §2), which is
        why the presented code arrives in the body of a request the *operator* makes.
      summary: 'Station state: counters, capture rate, recent scans'
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - participation
      responses:
        '200':
          description: No response body
    post:
      operationId: participation_events_scan_create
      description: |-
        The door.

        The organiser scans the student, never the reverse (AGENT_PROMPT §2), which is
        why the presented code arrives in the body of a request the *operator* makes.
      summary: Resolve one presented code
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - participation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScanRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScanRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/participation/events/{event_id}/scan-session:
    post:
      operationId: participation_events_scan_session_create
      description: |-
        Issue the long-lived, event-bound station session (Identity §5.3).

        Deliberately an exception to the 15-minute access token: an organiser cannot
        re-authenticate mid-queue, and a station that logs out during an event is
        abandoned in favour of a paper list. The session expires with the event, and
        IsEventOrganiser refuses it at any other event.
      summary: Issue a scan-station session bound to one event
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - participation
      responses:
        '200':
          description: No response body
  /api/v1/participation/events/{event_id}/scan/sync:
    post:
      operationId: participation_events_scan_sync_create
      description: Replay a station's offline queue (AGENT_PROMPT §5).
      summary: Replay queued offline scans
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - participation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineBatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OfflineBatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OfflineBatch'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/participation/me/qr:
    get:
      operationId: participation_me_qr_retrieve
      description: 'The student''s wallet: one pass per live registration, plus the
